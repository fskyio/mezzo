version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{.Version}}-{{ .Os }}-{{ .Arch }}{{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

kos:
  - repositories:
      - foundry.fsky.io/fsky/mezzo
    tags:
      - '{{.Version}}'
      - latest
    bare: true
    preserve_import_paths: false
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: none

gitea_urls:
  api: https://foundry.fsky.io/api/v1
  download: https://foundry.fsky.io

release:
  gitea:
    owner: fsky
    name: mezzo
  name_template: "Mezzo v{{.Version}}"
  disable: false
  mode: append
