version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - binary: mezzo   
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - netbsd
      - illumos
    id: mezzo
    main: ./cmd/mezzo

archives:
  - formats: [binary]
    name_template: >-
      {{ .ProjectName }}-{{.Version}}-{{ .Os }}-{{ .Arch }}{{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: 'checksums.txt'

nfpms:
  - id: mezzo
    ids:
      - mezzo
    package_name: mezzo
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://mezzo.fsky.io/
    maintainer: FSKY <development@fsky.io>
    description: |-
      Mezzo is a privacy-focused front-end for Tenor that lets you browse and
      view GIFs without Google's tracking and advertising systems.
    license: AGPL-3.0-or-later
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    section: web
    priority: optional
    umask: 0o022
    contents:
      - src: ./packaging/systemd/mezzo.service
        dst: /lib/systemd/system/mezzo.service
        packager: deb
      - src: ./packaging/systemd/mezzo.service
        dst: /usr/lib/systemd/system/mezzo.service
        packager: rpm
      - src: ./packaging/systemd/mezzo.service
        dst: /usr/lib/systemd/system/mezzo.service
        packager: archlinux
      - src: ./packaging/env/mezzo.default
        dst: /etc/default/mezzo
        type: config|noreplace
        packager: deb
      - src: ./packaging/env/mezzo.sysconfig
        dst: /etc/sysconfig/mezzo
        type: config|noreplace
        packager: rpm
      - src: ./packaging/env/mezzo.confd
        dst: /etc/conf.d/mezzo
        type: config|noreplace
        packager: archlinux
      - src: ./LICENSE
        dst: /usr/share/doc/mezzo/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/mezzo/README.md
    scripts:
      postinstall: ./packaging/scripts/postinstall.sh
      postremove: ./packaging/scripts/postremove.sh
    overrides:
      rpm:
        dependencies:
          - systemd
      archlinux:
        dependencies:
          - systemd
    deb:
      lintian_overrides:
        - statically-linked-binary

kos:
  - repositories:
      - foundry.fsky.io/fsky/mezzo
    tags:
      - '{{.Version}}'
      - latest
    bare: true
    preserve_import_paths: false
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: none
    labels:
      org.opencontainers.image.authors: FSKY
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.description: A private and lightweight GIF viewer for Tenor
      org.opencontainers.image.licenses: AGPL-3.0-or-later
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.source: https://foundry.fsky.io/fsky/mezzo
      org.opencontainers.image.title: Mezzo
      org.opencontainers.image.url: https://mezzo.fsky.io/
      org.opencontainers.image.vendor: FSKY
      org.opencontainers.image.version: "{{.Version}}"

gitea_urls:
  api: https://foundry.fsky.io/api/v1
  download: https://foundry.fsky.io

release:
  gitea:
    owner: fsky
    name: mezzo
  name_template: "Mezzo v{{.Version}}"
  disable: false
  mode: append
