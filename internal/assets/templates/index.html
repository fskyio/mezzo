{{define "content"}}
	<div class="index-hero">
		<h1>A privacy-respecting front-end for Tenor</h1>
	</div>
	<div class="usage-section">
		<h2>Usage</h2>
		<p>Replace <code>tenor.com</code> with this instance's domain:</p>
		<h3>Example</h3>
		<pre><code>https://tenor.com/view/a-on-the-test-gif-16733124990588327175</code></pre>
		<p>becomes</p>
		<pre><code>{{.Scheme}}://{{.Host}}/view/a-on-the-test-gif-16733124990588327175</code></pre>
	</div>
{{end}}
