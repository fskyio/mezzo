{{define "content"}}
	<div class="error-page">
		<h1>{{.Code}}</h1>
		<h2>{{.Heading}}</h2>
		<p>{{.Message}}</p>
		<div class="error-actions">
			{{if .TenorURL}}
			<a class="button secondary" href="{{.TenorURL}}">Open in Tenor</a>
			{{end}}
			<a class="button primary" href="">Try again</a>
		</div>
	</div>
{{end}}
